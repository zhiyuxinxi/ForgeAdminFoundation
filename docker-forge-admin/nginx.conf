server {
    listen 80;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- 静态资源缓存策略（保证发布修复及时送达用户） ----------
    # 原则：
    #   1) 仅 assets/ 下**文件名明确携带内容哈希**的资源（真实构建产物为
    #      [.-]<8–9 位 base64url 哈希>.<ext>，如 index-qJhlsF2U.js、uni.16322ebd.css、
    #      pages-todo.-qRLYtgb.js）允许 public,max-age=31536000,immutable；
    #   2) 非哈希 assets、static/ 及所有默认静态：Cache-Control no-cache（回源校验），
    #      不允许固定长缓存；
    #   3) 入口 HTML（/forge(-h5)/、/forge(-h5)/index.html）与任意 SPA fallback HTML：
    #      Cache-Control no-store, no-cache, must-revalidate + Pragma no-cache + Expires 0；
    #   4) API 代理 location 不携带任何静态缓存头（继承 server 级安全头）。

    # 前端静态资源
    location /forge/ {
        alias   /usr/share/nginx/html/forge/;
        index  index.html index.htm;
        try_files $uri $uri/ /forge/index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 非哈希静态默认：no-cache 回源校验
        add_header Cache-Control "no-cache" always;
    }

    # PC 入口（目录请求精确命中）：入口 HTML 强制不缓存
    location = /forge/ {
        alias /usr/share/nginx/html/forge/;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /forge-h5 {
        return 308 /forge-h5/;
    }

    # 移动端 H5 与 PC 共用同一来源，避免跨域、额外端口和重复认证边界。
    location /forge-h5/ {
        alias   /usr/share/nginx/html/forge-h5/;
        index  index.html;
        try_files $uri $uri/ /forge-h5/index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 非哈希静态默认：no-cache 回源校验
        add_header Cache-Control "no-cache" always;
    }

    # 移动端 H5 入口（目录请求精确命中）：入口 HTML 强制不缓存
    location = /forge-h5/ {
        alias /usr/share/nginx/html/forge-h5/;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 入口 / SPA fallback HTML（显式 index.html 与任意不存在的本地路径 fallback）：不缓存。
    # 正则 location 优先于前缀 location；try_files 内部跳转到 index.html 后仍命中本规则。
    location ~* "^/(forge|forge-h5)/.*\.html$" {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 内容哈希资源：仅文件名携带 8–9 位内容哈希（真实产物：index-qJhlsF2U.js /
    # uni.16322ebd.css / pages-todo.-qRLYtgb.js / no-data-CcvYvB2P.png）才允许 immutable。
    # 非哈希文件（如 static/、favicon、未哈希 assets）不会命中本规则，走前缀 location 的 no-cache。
    location ~* "^/(forge|forge-h5)/assets/[^/]*[.-][A-Za-z0-9_-]{8,9}\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$" {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 流程服务 API（路径更长，优先匹配）
    location /forge-api/api/flow/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-flow:8081/api/flow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # H5 流程查询与业务流程动作保持由 Flow 服务承载。
    location /forge-h5-api/api/flow/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-flow:8081/api/flow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /forge-h5-api/ai/business/flow/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-flow:8081/ai/business/flow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端主服务 API
    location /forge-api/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-admin:8580/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 移动端认证、菜单、消息、低代码 CRUD 与协同接口只进入 App 服务。
    location /forge-h5-api/ {
        # PC-only 项目不运行 App；仅在真正收到 H5 请求时解析 Docker 服务名。
        # rewrite 保持原静态 proxy_pass 尾斜线的前缀剥离语义及查询参数。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $forge_app_backend forge-app:8583;
        rewrite ^/forge-h5-api/(.*)$ /$1 break;
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://$forge_app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文件上传大小限制
    client_max_body_size 20m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
}
